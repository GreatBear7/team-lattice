  - id: H-11
    title: Band comparison that accounts for the baseline's own sampling error
    points: "Supports 25 - valid analyses (correct time-of-day flags)"
    status: done
    owner: "Saptarshi"
    started_at: "2026-10-16 23:10"
    owns: ["app/qc.py", "tests/", "docs/api-contract/", "docs/Final_Plan.en.md", "docs/Final_Plan.md",
           "data/README.md"]
    notes: >
      The band flag used p0_band + 3*sqrt(p0(1-p0)/n_band), which treats the
      14-day baseline rate as exact. Bands have about as many baseline as
      monitoring calls, so in 1,000 simulated normal months 57% had at least
      one false band alarm (nominal about 4% for 30 comparisons). Replace it
      with the pooled two-proportion z test (z > 3, decided in integers), and
      report the equivalent ucl/lcl lines so the chart is unchanged in shape.
      Daily p chart unchanged. Frontend fixtures (C) must be regenerated after.
    definition_of_done: >
      .venv/bin/python -m pytest tests -q passes, including a known answer
      (120/600 vs 180/600 gives z = 4.0, flag), the exact z = 3 boundary
      (555/2400 vs 645/2400, no flag), and the data flags (normal: none;
      recovery: C midday and evening rush; morning_tail: D morning rush);
      an independent stats review passes.
    result: "Band flag is now a pooled two-proportion z > 3 (integer-exact; ucl/lcl are the z = +-3 lines); false-alarm months 57% -> 3.7% in 1,000 sims, planted problems still flagged; 110 tests pass; stats-reviewer PASS"

